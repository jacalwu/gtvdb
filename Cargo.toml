[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arrow = { version = "59", features = ["prettyprint"] }
datafusion = "55"
thiserror = "2"
anyhow = "1"
rustyline = "14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
