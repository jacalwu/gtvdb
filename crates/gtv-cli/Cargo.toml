[package]
name = "gtv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gtv"
path = "src/main.rs"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
gtv-core = { path = "../gtv-core" }
gtv-array = { path = "../gtv-array" }
gtv-engine = { path = "../gtv-engine" }
gtv-index = { path = "../gtv-index" }
gtv-index-store = { path = "../gtv-index-store" }
gtv-storage = { path = "../gtv-storage" }
gtv-catalog = { path = "../gtv-catalog" }
gtv-delta = { path = "../gtv-delta" }
gtv-pattern = { path = "../gtv-pattern" }
gtv-udf = { path = "../gtv-udf" }
gtv-proto = { path = "../gtv-proto" }
gtv-enterprise-sql = { path = "../gtv-enterprise-sql" }
arrow.workspace = true
anyhow.workspace = true
rustyline.workspace = true
tokio.workspace = true
rayon.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde_json = "1"
ureq = "2"
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
chrono = "0.4"
