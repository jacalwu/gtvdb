[package]
name = "gtv-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
datafusion.workspace = true
arrow.workspace = true
gtv-core = { path = "../gtv-core" }
gtv-array = { path = "../gtv-array" }
gtv-pattern = { path = "../gtv-pattern" }
gtv-storage = { path = "../gtv-storage" }
thiserror.workspace = true
ureq = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow.workspace = true
chrono = "0.4"

[features]
default = []
# Exact LP CRM allocator (Phase 3) over the optimizable pool.
# Enables gtv-array's `crm-lp` feature (pure-Rust microlp backend via good_lp)
# and the `method = 'lp'` dispatch in crm_alloc / crm_audit.
crm-lp = ["gtv-array/crm-lp"]
